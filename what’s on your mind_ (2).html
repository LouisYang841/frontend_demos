 X.filter='none';X.globalAlpha=1;X.globalCompositeOperation='source-over';
 requestAnimationFrame(frame);
}
// twinkling dashes around the input
(function(){
 const w=document.getElementById('wrap');
 const hw=Math.min(320,innerWidth*.44);
 for(let i=0;i<30;i++){
  const a=Math.random()*Math.PI*2,rx=hw+30+Math.random()*Math.min(240,innerWidth*.25),ry=70+Math.random()*170;
  const d=document.createElement('i');d.className='dash';
  d.style.cssText='left:'+(Math.cos(a)*rx)+'px;top:'+(Math.sin(a)*ry)+'px;width:'+(8+Math.random()*12)+'px;--o:'+(.3+Math.random()*.6)+';--d:'+(2+Math.random()*4)+'s;--l:'+(-Math.random()*6)+'s;transform:rotate('+(Math.random()<.8?0:(Math.random()*40-20))+'deg)';
  w.appendChild(d);
 }
})();
let mx=-999,my=-999;const ripples=[];
function hit(x,y){let b=null,bd=1e9;for(const j of jel){const Wd=105*j.sz*sc*j.sp.wide*1.15,Hh=92*j.sz*sc*j.sp.ar*1.4,dx=x-j.x,dy=y-j.y,ca=Math.cos(j.a),sa=Math.sin(j.a),lx=dx*ca+dy*sa,ly=-dx*sa+dy*ca,nx=lx/Wd,ny=-ly/Hh;
 if(ny>-.5&&ny<1.05&&nx*nx+(ny>0?ny*ny:ny*ny*.3)<1){const d=dx*dx+dy*dy;if(d<bd){bd=d;b=j}}}return b}
cv.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;cv.style.cursor=hit(mx,my)?'pointer':'default'});
cv.addEventListener('pointerleave',()=>{mx=my=-999});
cv.addEventListener('pointerdown',e=>{
 const x=e.clientX,y=e.clientY,t=performance.now()/1000,j=hit(x,y);
 if(j){const dx=x-j.x,dy=y-j.y,ca=Math.cos(j.a),sa=Math.sin(j.a);j.sw={x:dx*ca+dy*sa,y:-dx*sa+dy*ca,t0:t};j.pn=1}
 ripples.push({x,y,t0:t,sp:(j?110:150)*sc,am:j?.9:1});
 for(const o of jel){if(o===j)continue;const dx=o.x-x,dy=o.y-y,d=Math.hypot(dx,dy)||1,R0=260*sc;
  if(d<R0){const f=1-d/R0;o.vx+=dx/d*40*f*sc;o.vy+=dy/d*40*f*sc;o.pn=Math.max(o.pn,.6*f)}}
});
